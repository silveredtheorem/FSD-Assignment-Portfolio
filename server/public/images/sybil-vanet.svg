<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-labelledby="sybil-vanet-title">
  <title id="sybil-vanet-title">Network graph of connected vehicle nodes, one flagged, representing the VANET sybil detection project</title>
  <rect width="400" height="200" fill="#161616"/>
  <g stroke="#3a3630" stroke-width="1.5">
    <line x1="70" y1="60" x2="180" y2="40"/>
    <line x1="70" y1="60" x2="60" y2="150"/>
    <line x1="180" y1="40" x2="260" y2="70"/>
    <line x1="180" y1="40" x2="150" y2="130"/>
    <line x1="60" y1="150" x2="150" y2="130"/>
    <line x1="150" y1="130" x2="260" y2="70"/>
    <line x1="260" y1="70" x2="330" y2="110"/>
    <line x1="150" y1="130" x2="240" y2="160"/>
    <line x1="240" y1="160" x2="330" y2="110"/>
  </g>
  <g fill="#c9a96e">
    <circle cx="70"  cy="60"  r="7"/>
    <circle cx="180" cy="40"  r="7"/>
    <circle cx="60"  cy="150" r="7"/>
    <circle cx="150" cy="130" r="7"/>
    <circle cx="330" cy="110" r="7"/>
    <circle cx="240" cy="160" r="7"/>
  </g>
  <circle cx="260" cy="70" r="9" fill="none" stroke="#e07070" stroke-width="2.5"/>
  <circle cx="260" cy="70" r="3" fill="#e07070"/>
</svg>
