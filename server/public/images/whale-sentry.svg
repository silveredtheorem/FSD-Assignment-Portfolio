<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-labelledby="whale-sentry-title">
  <title id="whale-sentry-title">Price line chart with an anomaly spike, representing Whale Sentry</title>
  <rect width="400" height="200" fill="#161616"/>
  <g fill="none" stroke="#2a2a2a" stroke-width="1">
    <line x1="0" y1="50"  x2="400" y2="50"/>
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
  </g>
  <polyline
    points="10,130 40,120 70,135 100,110 130,118 160,100 190,45 220,95 250,80 280,90 310,70 340,85 390,60"
    fill="none" stroke="#c9a96e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="190" cy="45" r="6" fill="none" stroke="#e07070" stroke-width="2"/>
  <circle cx="190" cy="45" r="2" fill="#e07070"/>
</svg>
